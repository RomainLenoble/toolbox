# Configuration for the CAMS -> LBC creation pipeline (create_LBC.py) on the
# ALPX3 Arome domain, Belenos HPC.
#
# To run the pipeline on a different domain, copy this file (e.g. to
# config/MYDOMAIN.yaml), update the values below, and pass it via:
#   create_LBC.py --config config/MYDOMAIN.yaml --ERA5 ... --CAMS ... --mode ... --output ...
#
# See lbc_config.py for the full list of keys, their defaults, and validation
# rules.

# ---------------------------------------------------------------------------
# Filesystem paths
# ---------------------------------------------------------------------------
paths:
  # Path to the "gl" Fortran interpolation binary (Meteo-France GL tool).
  gl_bin: /home/gmgec/mrgo/lenobler/SAVE/code/GL/belenos/bin/gl

  # Climatology/orography file for the target domain. "{geom}" is replaced
  # with domain.name below.
  climate_file: /home/gmgec/mrgo/haradercoustaue/AROME49/NFR2.5/clim/clim_arpege.NFR2.5r.m01

  # Shell command sourced before every pipeline step (sets up the HPC module
  # environment and epygram). Leave empty ("") to skip.
  env_setup: "source /home/gmgec/mrgo/lenobler/SAVE/code/GL/config/setenv.belenos && . with_epygram_old"

  # Directory containing the pipeline scripts (interpole_current_folder.py,
  # Interpol_CAMS_to_ALPX3.py, interpolate_grib_hourly_epygram.py,
  # merge_LBC.py, merge_files.py). Leave unset (null) to use the directory
  # this config-loading module lives in (i.e. this repo's CAMS/ folder).
  scripts_dir: null

# ---------------------------------------------------------------------------
# Target domain / vertical grid definition
# ---------------------------------------------------------------------------
