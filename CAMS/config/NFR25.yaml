# ---------------------------------------------------------------------------
# Aerosol species
# ---------------------------------------------------------------------------
aerosols:
  # CAMS shortnames read/interpolated by the "gl" tool.
  cams_shortnames:
    - aermr01  # Sea Salt Aerosol (0.03 - 0.5 um) Mixing Ratio
    - aermr02  # Sea Salt Aerosol (0.5 - 5 um) Mixing Ratio
    - aermr03  # Sea Salt Aerosol (5 - 20 um) Mixing Ratio
    - aermr04  # Dust Aerosol (0.03 - 0.55 um) Mixing Ratio
    - aermr05  # Dust Aerosol (0.55 - 0.9 um) Mixing Ratio
    - aermr06  # Dust Aerosol (0.9 - 20 um) Mixing Ratio
    - aermr07  # Hydrophilic Organic Matter Aerosol Mixing Ratio
    - aermr08  # Hydrophobic Organic Matter Aerosol Mixing Ratio
    - aermr09  # Hydrophilic Black Carbon Aerosol Mixing Ratio
    - aermr10  # Hydrophobic Black Carbon Aerosol Mixing Ratio
    - aermr11  # Sulphate Aerosol Mixing Ratio

  # FA field names used when --mode MMR is selected (direct name mapping,
  # no LIMA particle scaling).
  mmr_faname:
    - SEASALT1_MMR
    - SEASALT2_MMR
    - SEASALT3_MMR
    - DUST1_MMR
    - DUST2_MMR
    - DUST3_MMR
    - OM1_MMR
    - OM2_MMR
    - BC1_MMR
    - BC2_MMR
    - SULF_MMR

# ---------------------------------------------------------------------------
# File naming conventions
# ---------------------------------------------------------------------------
naming:
  # Raw CAMS input filenames must start with this prefix ("{geom}" ->
  # domain.name). Adjust the trailing literal (here "2012") to match your
  # data, or remove it to match any year.
  cams_input_prefix: "CAMS_model"

  # Regex used to extract the datetime string from raw CAMS filenames, and
  # the corresponding strptime format.
  cams_input_datetime_regex: '(\d{4}-\d{2}-\d{2}_\d{2})'
  cams_input_datetime_format: "%Y-%m-%d_%H"

  # Prefix for CAMS files once interpolated onto the target grid.
  cams_interp_prefix: "CAMS_model_level_"

  # Prefix of the ERA5 LBC files to merge with the interpolated CAMS files
  # ("{geom}" -> domain.name).
  era5_prefix: "NFR3ERA5LBC"

  # Prefix for the final merged output files ("{geom}" -> domain.name).
  merge_output_prefix: "{geom}_ERA5_CAMS_"

# ---------------------------------------------------------------------------
# Runtime / parallelism
# ---------------------------------------------------------------------------
runtime:
  # Number of worker processes for the hourly time-interpolation step.
  nproc_time_interp: 10

  # Number of worker processes for the ERA5/CAMS merge step.
  max_workers_merge: 16

  # Maximum time difference (hours) allowed when matching a CAMS file to an
  # ERA5 LBC file.
  match_tolerance_hours: 1
