# Domain configuration for GL interpolation (ERA5 -> AROME LBC).
#
# Copy this file to make a new domain (e.g. config/MY_DOMAIN.yaml) and edit
# the values below. Pass it to the scripts with --config path/to/file.yaml.
#
# Everything under `site:` is specific to *your* account/install and almost
# certainly needs to change if you are not lenobler.

site:
  # Directory containing the `gl` executable.
  gl_bin_dir: /home/gmgec/mrgo/lenobler/SAVE/code/GL/belenos/bin

  # Optional: root directory in which per-task scratch work directories are
  # created (naminterp + climate_aladin symlink live here, one per file).
  # Leave null to use the system default temp dir ($TMPDIR or /tmp).
  scratch_dir: /scratch/work/lenobler/tmp/GL

paths:
  # Folder containing the raw input files to interpolate.
  input_folder: /scratch/work/lenobler/DATA/LBC/00_ERA5/ALEX_2020
  # Folder the interpolated output files are written to (created if
  # missing).
  output_folder: /scratch/work/lenobler/DATA/LBC/06_test

input_files:
  # Only filenames starting with this prefix are processed.
  prefix: era5_2
  # Filenames ending with this suffix are always skipped (MARS .info
  # sidecar files).
  exclude_suffix: .info
  # Regex used to extract the timestamp embedded in the filename.
  date_regex: '(\d{8}_\d{2})'
  # strptime format matching the string captured by date_regex.
  date_format: '%Y%m%d_%H'

domain:
  # Geometry name, used to build the climate file path and the default
  # output filename prefix.
  name: ALPX3

  # Path to the target climate/constant file. "{name}" is substituted with
  # domain.name above.
  climate_file: /scratch/climat/CEDRE/data/atm/BCOND/{name}CIE/Const.Clim.{name}CIE.01

  # Output filename pattern. "{name}" -> domain name, "{date}" -> the
  # file's datetime formatted as %Y%m%d.%H00 (matches the input filename's
  # embedded timestamp).
  output_pattern: "{name}ERA5LBC{date}"

vertical_levels:
  nlev: 60
  order: 3
  ne2ealg: 2

